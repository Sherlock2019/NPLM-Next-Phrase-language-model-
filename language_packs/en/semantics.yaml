# ---------------------------------------------------------------------------
# Scoring
# ---------------------------------------------------------------------------
scoring:
  # Weight of each evidence kind when it is available. Absent evidence contributes
  # nothing at all rather than a default.
  evidence_weights:
    gazetteer_hit: 1.0
    entity_type_match: 0.9
    pos_head_match: 0.6
    pos_open_match: 0.45
    gazetteer_miss_other_slot: 0.8 # the word is a strong member of a *different* slot's class
    pos_mismatch: 0.5

  # A capitalised out-of-vocabulary word is probably a proper noun, which favours
  # entity slots. Weak evidence, used only when nothing better exists.
  capitalised_suggests_proper_noun: 0.35

  # Below this compatibility a candidate is called "less compatible", never
  # "impossible" - the scorer does not implement hard rules (metrics brief §11).
  low_compatibility: 0.35
