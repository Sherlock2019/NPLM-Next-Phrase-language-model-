# Slot compatibility evidence for English.
#
# This file answers one question: given that SPLM expects a WHERE next, is this
# candidate word a plausible WHERE?
#
# HONESTY NOTE - read before trusting any number computed from this file.
#
# The gazetteers below are *seeds*, not coverage. They contain a few hundred
# entries, not the world's place names. So the classifier has three outcomes, not
# two: compatible, incompatible, and NO EVIDENCE. Metrics built on it (Semantic
# Focus, Candidate Relevance, Semantic Noise) must report the share of candidates
# that had evidence at all, and must not treat "no evidence" as "incompatible".
#
# Replacing these seeds with a real resource (Wikidata place types, WordNet
# hypernyms, a Wiktionary category dump) is the single highest-value upgrade to
# SPLM's semantic scoring. Until then these metrics are indicative, not decisive.

language: en
version: 1
coverage: seed # seed | partial | full - reported in the UI alongside any metric

# ---------------------------------------------------------------------------
# What kind of word can fill each slot
# ---------------------------------------------------------------------------
# Part of speech is the one signal available for every candidate, so it does most
# of the work. `pos_allow` lists tags that can *head* the slot's constituent;
# `pos_open` lists tags that can legitimately begin it (a determiner opens an
# object, a preposition opens a location).
slot_requirements:

  subject:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [DET, PRON, PROPN, NOUN, ADJ, NUM]
    entity_types: [PERSON, ORG]
    animate_preferred: true

  objects:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [DET, PRON, PROPN, NOUN, ADJ, NUM]

  recipients:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [DET, PRON, PROPN, NOUN]
    entity_types: [PERSON, ORG]
    animate_preferred: true

  participants:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [DET, PRON, PROPN, NOUN]
    entity_types: [PERSON, ORG]
    animate_preferred: true

  location:
    pos_allow: [NOUN, PROPN]
    pos_open: [DET, PROPN, NOUN, ADJ]
    entity_types: [LOCATION, FACILITY, ORG]
    classes: [city, country, region, place, building, geography]

  destination:
    pos_allow: [NOUN, PROPN]
    pos_open: [DET, PROPN, NOUN]
    entity_types: [LOCATION, FACILITY, ORG]
    classes: [city, country, region, place, building]

  source:
    pos_allow: [NOUN, PROPN]
    pos_open: [DET, PROPN, NOUN]
    entity_types: [LOCATION, FACILITY, ORG]
    classes: [city, country, region, place, building]

  time:
    pos_allow: [NOUN, PROPN, ADV, NUM]
    pos_open: [DET, NOUN, PROPN, ADV, NUM, ADJ]
    entity_types: [TIME]
    classes: [weekday, month, time_unit, time_adverb]

  manner:
    pos_allow: [ADV, NOUN, ADJ]
    pos_open: [ADV, DET, NOUN, ADJ]
    classes: [transport, manner_adverb]

  instrument:
    pos_allow: [NOUN, PROPN]
    pos_open: [DET, NOUN, PROPN, ADJ]
    classes: [tool, software, machine]

  cause:
    pos_allow: [NOUN, PROPN, VERB, PRON]
    pos_open: [DET, NOUN, PRON, PROPN]

  goal:
    pos_allow: [VERB, NOUN]
    pos_open: [VERB, DET, NOUN]

  condition:
    pos_allow: [VERB, NOUN, PRON]
    pos_open: [PRON, DET, NOUN, PROPN]

  predicate:
    pos_allow: [VERB, AUX, ADJ]
    pos_open: [VERB, AUX, ADV]

