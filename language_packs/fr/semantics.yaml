# Slot compatibility evidence for French.
#
# Same honesty note as the English pack: these gazetteers are SEEDS, not coverage.
# The classifier has three outcomes - compatible, incompatible, and no evidence - and
# every metric built on it reports how many candidates it could judge at all.

language: fr
version: 1
coverage: seed

slot_requirements:
  subject:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [DET, PRON, PROPN, NOUN, ADJ, NUM]
    entity_types: [PERSON, ORG]
    animate_preferred: true
  objects:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [DET, PRON, PROPN, NOUN, ADJ, NUM]
  recipients:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [DET, PRON, PROPN, NOUN]
    entity_types: [PERSON, ORG]
    animate_preferred: true
  participants:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [DET, PRON, PROPN, NOUN]
    entity_types: [PERSON, ORG]
    animate_preferred: true
  location:
    pos_allow: [NOUN, PROPN]
    pos_open: [DET, PROPN, NOUN, ADJ]
    entity_types: [LOCATION, FACILITY, ORG]
    classes: [ville, pays, region, lieu, batiment, geographie]
  destination:
    pos_allow: [NOUN, PROPN]
    pos_open: [DET, PROPN, NOUN]
    entity_types: [LOCATION, FACILITY, ORG]
    classes: [ville, pays, region, lieu, batiment]
  source:
    pos_allow: [NOUN, PROPN]
    pos_open: [DET, PROPN, NOUN]
    entity_types: [LOCATION, FACILITY, ORG]
    classes: [ville, pays, region, lieu, batiment]
  time:
    pos_allow: [NOUN, PROPN, ADV, NUM]
    pos_open: [DET, NOUN, PROPN, ADV, NUM, ADJ]
    entity_types: [TIME]
    classes: [jour, mois, duree, adverbe_temps]
  manner:
    pos_allow: [ADV, NOUN, ADJ]
    pos_open: [ADV, DET, NOUN, ADJ]
    classes: [transport, adverbe_maniere]
  instrument:
    pos_allow: [NOUN, PROPN]
    pos_open: [DET, NOUN, PROPN, ADJ]
    classes: [tool, logiciel, machine]
  cause:
    pos_allow: [NOUN, PROPN, VERB, PRON]
    pos_open: [DET, NOUN, PRON, PROPN]
  goal:
    pos_allow: [VERB, NOUN]
    pos_open: [VERB, DET, NOUN]
  condition:
    pos_allow: [VERB, NOUN, PRON]
    pos_open: [PRON, DET, NOUN, PROPN]
  predicate:
    pos_allow: [VERB, AUX, ADJ]
    pos_open: [VERB, AUX, ADV]

