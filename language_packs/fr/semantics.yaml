     amsterdam, bruxelles, dublin, genève, zurich, munich, milan, barcelone,
     athènes, varsovie, budapest, copenhague, stockholm, oslo, helsinki, moscou,
     istanbul, le_caire, dubaï, bombay, delhi, bangkok, singapour, séoul, pékin,
     shanghai, sydney, melbourne, toronto, montréal, vancouver, chicago, boston,
     lyon, marseille, toulouse, bordeaux, lille, nantes, nice, strasbourg,
     hanoï, saïgon, dakar, abidjan]
  pays:
    [france, allemagne, espagne, italie, portugal, angleterre, écosse, irlande,
     belgique, suisse, autriche, pologne, grèce, suède, norvège, danemark,
     finlande, russie, turquie, égypte, maroc, sénégal, nigéria, kenya, chine,
     japon, corée, inde, vietnam, thaïlande, indonésie, australie, canada,
     mexique, brésil, argentine, chili, pérou]
  region:
    [europe, asie, afrique, amérique, scandinavie, balkans, caraïbes,
     méditerranée, normandie, provence, bretagne, alsace, bourgogne, toscane]
  lieu:
    [ville, village, pays, région, quartier, campus, siège, centre, banlieue,
     capitale, port, frontière, zone]
  batiment:
    [bureau, hôtel, aéroport, gare, restaurant, café, bar, hôpital, école,
     université, bibliothèque, musée, théâtre, stade, usine, entrepôt, salle,
     immeuble, tour, appartement, maison, ambassade, terminal]
  geographie:
    [parc, plage, montagne, lac, rivière, fleuve, forêt, île, vallée, côte,
     désert, colline, jardin, place, rue, avenue, route, pont]
  jour:
    [lundi, mardi, mercredi, jeudi, vendredi, samedi, dimanche]
  mois:
    [janvier, février, mars, avril, mai, juin, juillet, août, septembre,
     octobre, novembre, décembre]
  duree:
    [seconde, secondes, minute, minutes, heure, heures, jour, jours, semaine,
     semaines, mois, année, années, décennie, matin, matinée, après-midi, soir,
     soirée, nuit, midi, minuit, week-end, trimestre, semestre]
  adverbe_temps:
    [hier, aujourd'hui, demain, maintenant, bientôt, tard, tôt, ensuite,
     récemment, déjà, alors, immédiatement]
  logiciel:
    [terraform, ansible, docker, kubernetes, jenkins, github, gitlab, python,
     java, javascript, sql, linux, aws, azure, postgres, mysql, redis]
  machine:
    [ordinateur, portable, serveur, téléphone, tablette, imprimante, robot,
