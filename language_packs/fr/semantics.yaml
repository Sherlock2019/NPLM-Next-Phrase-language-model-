scoring:
  evidence_weights:
    gazetteer_hit: 1.0
    entity_type_match: 0.9
    pos_head_match: 0.6
    pos_open_match: 0.45
    gazetteer_miss_other_slot: 0.8
    pos_mismatch: 0.5
  capitalised_suggests_proper_noun: 0.35
  low_compatibility: 0.35
