# Slot compatibility evidence for Vietnamese.
#
# Same honesty note as the other packs: SEED gazetteers, three outcomes (compatible,
# incompatible, no evidence), and every derived metric reports its coverage.
#
# Coverage is thinnest here. Vietnamese also breaks the capitalisation heuristic the
# English pack leans on - common nouns are not capitalised, but neither are many
# borrowed place names in running text - so proper-noun guessing is weaker and the
# classifier says "unknown" more often. That shows up as lower coverage, not as
# confident wrong answers.

language: vi
version: 1
coverage: seed

slot_requirements:
  subject:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [PRON, PROPN, NOUN, NUM, DET]
    entity_types: [PERSON, ORG]
    animate_preferred: true
  objects:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [DET, PRON, PROPN, NOUN, NUM, ADJ]
  recipients:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [ADP, PRON, PROPN, NOUN]
    entity_types: [PERSON, ORG]
    animate_preferred: true
  participants:
    pos_allow: [NOUN, PROPN, PRON]
    pos_open: [ADP, PRON, PROPN, NOUN]
    entity_types: [PERSON, ORG]
    animate_preferred: true
  location:
    pos_allow: [NOUN, PROPN]
    pos_open: [ADP, PROPN, NOUN, DET]
    entity_types: [LOCATION, FACILITY, ORG]
    classes: [thanh_pho, quoc_gia, khu_vuc, noi, toa_nha, dia_ly]
  destination:
    pos_allow: [NOUN, PROPN]
    pos_open: [ADP, PROPN, NOUN]
    entity_types: [LOCATION, FACILITY, ORG]
    classes: [thanh_pho, quoc_gia, khu_vuc, noi, toa_nha]
  source:
    pos_allow: [NOUN, PROPN]
    pos_open: [ADP, PROPN, NOUN]
    entity_types: [LOCATION, FACILITY, ORG]
    classes: [thanh_pho, quoc_gia, khu_vuc, noi, toa_nha]
  time:
    pos_allow: [NOUN, PROPN, ADV, NUM]
    pos_open: [ADP, NOUN, PROPN, ADV, NUM, DET]
    entity_types: [TIME]
    classes: [thu, thang, thoi_luong, trang_tu_thoi_gian]
  manner:
    pos_allow: [ADV, NOUN, ADJ]
    pos_open: [ADP, ADV, NOUN, ADJ]
    classes: [transport, trang_tu_cach]
  instrument:
    pos_allow: [NOUN, PROPN]
    pos_open: [ADP, NOUN, PROPN]
    classes: [tool, phan_mem, may]
  cause:
    pos_allow: [NOUN, PROPN, VERB, PRON]
    pos_open: [SCONJ, ADP, NOUN, PRON, PROPN]
  goal:
    pos_allow: [VERB, NOUN]
    pos_open: [SCONJ, ADP, VERB, NOUN]
  condition:
    pos_allow: [VERB, NOUN, PRON]
    pos_open: [SCONJ, PRON, NOUN, PROPN]
  predicate:
    pos_allow: [VERB, AUX, ADJ]
    pos_open: [VERB, AUX, ADJ, ADV]

